name: CI

on:
  push:
    branches:
      - main
    # Roadmaps, debates, proposals and decisions are not build inputs.
    paths-ignore:
      - 'docs/**'
  pull_request:
    # A draft runs nothing. Pull requests stay drafts until their review is clean,
    # so CI runs once as the last gate before the merge.
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'docs/**'

# A new push to a pull request cancels the run of the push before it.
# Runs on pushes are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  test:
    name: Test (Node.js ${{ matrix.node-version }})
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Build packages
        run: pnpm build

      - name: Type-check
        run: pnpm type-check

      - name: Test
        run: pnpm test

      - name: Build examples
        run: pnpm build:examples
